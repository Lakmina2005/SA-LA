<!doctype html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#faf4ff" />
  <title>Orchid 3D Gallery — Lakmina &amp; Sanjana 💜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #faf4ff;
      --bg-glow-1: rgba(192, 38, 211, 0.14);
      --bg-glow-2: rgba(124, 58, 237, 0.12);
      --text-main: #3b0764;
      --text-muted: rgba(112, 26, 117, 0.75);
      --surface: rgba(255, 255, 255, 0.92);
      --surface-solid: #ffffff;
      --surface-soft: #f3e8ff;
      --border: rgba(217, 70, 239, 0.25);
      --hero-bg: linear-gradient(135deg, #fdf4ff 0%, #f3e8ff 55%, #fae8ff 100%);
      --hero-shadow: 0 12px 28px rgba(134, 25, 143, 0.12), 0 6px 0 #e9d5ff;
      --card-shadow: 0 6px 0 #e9d5ff, 0 12px 24px rgba(112, 26, 117, 0.1);
      --card-active: 0 2px 0 #e9d5ff;
      --dock-bg: rgba(255, 251, 255, 0.94);
      --dock-active: linear-gradient(180deg, #c026d3 0%, #9333ea 100%);
      --accent-btn: linear-gradient(180deg, #c026d3 0%, #9333ea 100%);
      --accent-shadow: 0 4px 0 #6b21a8;
      --divider: rgba(216, 180, 254, 0.65);
    }

    html[data-theme="dark"] {
      --bg-page: #130524;
      --bg-glow-1: rgba(217, 70, 239, 0.18);
      --bg-glow-2: rgba(124, 58, 237, 0.2);
      --text-main: #fdf4ff;
      --text-muted: rgba(240, 171, 252, 0.78);
      --surface: rgba(33, 12, 61, 0.92);
      --surface-solid: #261045;
      --surface-soft: #1c0a36;
      --border: rgba(217, 70, 239, 0.3);
      --hero-bg: linear-gradient(135deg, #2e1065 0%, #3b0764 55%, #4a044e 100%);
      --hero-shadow: 0 16px 34px rgba(0, 0, 0, 0.5), 0 6px 0 #16052e;
      --card-shadow: 0 6px 0 #130529, 0 12px 24px rgba(0, 0, 0, 0.48);
      --card-active: 0 2px 0 #130529;
      --dock-bg: rgba(26, 9, 48, 0.95);
      --dock-active: linear-gradient(180deg, #d946ef 0%, #a855f7 100%);
      --accent-btn: linear-gradient(180deg, #d946ef 0%, #a21caf 100%);
      --accent-shadow: 0 4px 0 #4a044e;
      --divider: rgba(168, 85, 247, 0.32);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100dvh;
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      overscroll-behavior-y: contain;
      transition: background-color 200ms ease, color 200ms ease;
    }

    body {
      padding-bottom: calc(92px + env(safe-area-inset-bottom));
      position: relative;
      overflow-x: hidden;
    }

    .bg-mesh {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 10%, var(--bg-glow-1), transparent 48%),
        radial-gradient(circle at 85% 25%, var(--bg-glow-2), transparent 50%);
      z-index: 0;
    }

    /* Compact Sticky Header */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--dock-bg);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--divider);
      padding: 8px 14px;
    }

    .top-bar-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .back-btn {
      min-height: 44px;
      padding: 0 12px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-main);
      background: var(--surface-soft);
      border: 1px solid var(--border);
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .brand-center {
      text-align: center;
      min-width: 0;
    }

    .brand-center h1 {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-center span {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
    }

    .theme-btn {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text-main);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Main Content */
    .container {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 14px 0;
    }

    /* 3D Hero Album Card */
    .hero-card {
      background: var(--hero-bg);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: var(--hero-shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .hero-text h2 {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .hero-text p {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .hero-action {
      min-height: 44px;
      padding: 0 14px;
      border-radius: 14px;
      background: var(--accent-btn);
      color: #ffffff;
      text-decoration: none;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: var(--accent-shadow);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .hero-action:active {
      transform: translateY(2px);
    }

    /* 2-Column Polaroid 3D Grid (Mobile) -> 3/4 Col Desktop */
    .polaroid-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (min-width: 640px) {
      .polaroid-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }
    }

    @media (min-width: 900px) {
      .polaroid-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .polaroid-card {
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 9px 9px 12px;
      box-shadow: var(--card-shadow);
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 9px;
      touch-action: manipulation;
      transition:
        transform 130ms cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 130ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .polaroid-card:hover {
      transform: translateY(-3px);
    }

    .polaroid-card:active {
      transform: translateY(3px);
      box-shadow: var(--card-active);
    }

    .media-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 15px;
      overflow: hidden;
      background: var(--surface-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .media-placeholder {
      width: 100%;
      height: 100%;
      background: var(--hero-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      text-align: center;
    }

    .play-pill {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(19, 5, 36, 0.25);
    }

    .play-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.94);
      color: #86198f;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 3px;
      font-size: 16px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
    }

    .card-meta {
      padding: 0 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .card-title {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-kind {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* Drive Embed Panel */
    .drive-card {
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 12px;
      box-shadow: var(--card-shadow);
    }

    .drive-iframe {
      width: 100%;
      height: 62dvh;
      min-height: 400px;
      border: none;
      border-radius: 16px;
      background: #ffffff;
      display: block;
    }

    .drive-caption {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }

    .empty-card {
      text-align: center;
      padding: 36px 18px;
      border-radius: 24px;
      background: var(--surface);
      border: 1px dashed var(--border);
    }

    .empty-card h3 {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .empty-card p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 420px;
      margin: 0 auto 16px;
    }

    .btn-3d {
      border: none;
      min-height: 46px;
      padding: 0 18px;
      border-radius: 14px;
      background: var(--accent-btn);
      color: #ffffff;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 600;
      box-shadow: var(--accent-shadow);
      cursor: pointer;
    }

    /* Fixed Bottom Thumb-Zone Navigation Dock */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: var(--dock-bg);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--divider);
      padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
    }

    .dock-grid {
      max-width: 560px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .dock-tab {
      min-height: 52px;
      border: none;
      border-radius: 14px;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      transition: background 150ms ease, color 150ms ease, transform 120ms ease;
    }

    .dock-tab:active {
      transform: scale(0.95);
    }

    .dock-tab .d-ico {
      font-size: 18px;
      line-height: 1;
    }

    .dock-tab .d-lbl {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      white-space: nowrap;
    }

    .dock-tab.active {
      background: var(--dock-active);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(162, 28, 175, 0.3);
    }

    /* Fullscreen Viewer */
    .viewer {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      background: #0d031c;
      color: #fdf4ff;
      padding: 12px 12px calc(16px + env(safe-area-inset-bottom));
    }

    .viewer.open {
      display: flex;
    }

    .viewer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .viewer-counter {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #f5d0fe;
    }

    .viewer-title {
      font-size: 12px;
      color: #e9d5ff;
      max-width: 190px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .viewer-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .v-btn {
      min-width: 44px;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid rgba(240, 171, 252, 0.35);
      background: rgba(112, 26, 117, 0.55);
      color: #ffffff;
      border-radius: 14px;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-decoration: none;
      cursor: pointer;
    }

    .viewer-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 12px 0;
    }

    .viewer-photo {
      max-width: 100%;
      max-height: 100%;
      border-radius: 16px;
      object-fit: contain;
      transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
      cursor: zoom-in;
    }

    .viewer-photo.zoomed {
      transform: scale(1.85);
      cursor: zoom-out;
    }

    .viewer-video {
      width: 100%;
      max-width: 720px;
      max-height: 100%;
      border-radius: 16px;
      background: #000000;
    }

    .viewer-iframe {
      width: 100%;
      max-width: 720px;
      height: 100%;
      max-height: 520px;
      border: none;
      border-radius: 16px;
      background: #1c0a36;
    }

    .voice-card {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(160deg, #3b0764 0%, #1c0a36 100%);
      border: 1px solid rgba(240, 171, 252, 0.35);
      border-radius: 26px;
      padding: 26px 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .voice-bars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 44px;
      margin: 14px 0 18px;
    }

    .voice-bars span {
      width: 5px;
      border-radius: 99px;
      background: linear-gradient(180deg, #f5d0fe, #c026d3);
      animation: eqPulse 1.1s ease-in-out infinite;
    }

    .voice-bars span:nth-child(1) { height: 18px; }
    .voice-bars span:nth-child(2) { animation-delay: 0.15s; height: 34px; }
    .voice-bars span:nth-child(3) { animation-delay: 0.3s; height: 22px; }
    .voice-bars span:nth-child(4) { animation-delay: 0.45s; height: 38px; }
    .voice-bars span:nth-child(5) { animation-delay: 0.6s; height: 26px; }

    @keyframes eqPulse {
      0%, 100% { transform: scaleY(0.5); opacity: 0.7; }
      50% { transform: scaleY(1.1); opacity: 1; }
    }

    .viewer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .viewer-nav {
      min-width: 54px;
      min-height: 48px;
      border: 1px solid rgba(240, 171, 252, 0.35);
      background: rgba(112, 26, 117, 0.55);
      color: #ffffff;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }

    .viewer-hint {
      font-size: 12px;
      color: #f5d0fe;
      text-align: center;
      flex: 1;
    }
  </style>
</head>

      // =========================================================================
      // 3. ADD YOUR PHOTO, VIDEO & VOICE LINKS HERE
      // (මෙතනට දාන හැම Photo / Video / Voice එකක්ම Touch කරපු ගමන් ඒකේ Link එක Telegram Bot ට එනවා!)
      //
      // උදාහරණ:
      //   { type: 'photo', url: 'https://drive.google.com/file/d/FILE_ID/view?usp=sharing', title: 'Our Photo 💜' },
      //   { type: 'video', url: 'https://drive.google.com/file/d/FILE_ID/view?usp=sharing', title: 'Special Video 🎬' },
      //   { type: 'voice', url: 'https://drive.google.com/file/d/FILE_ID/view?usp=sharing', title: 'Sweet Voice 🎙️' },
      // =========================================================================
      const MEDIA_ITEMS = [
        // මෙතනට ඔයාගේ links දාන්න:
      ];

      // -------------------------------------------------------------------------
      // Telegram Notification Helper (Reliable across mobile & desktop browsers)
      // -------------------------------------------------------------------------
      function getSLTime() {
        try {
          return new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Asia/Colombo',
            year: 'numeric',
            month: 'short',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: true
          }).format(new Date());
        } catch (e) {
          return new Date().toLocaleString();
        }
      }

      function notifyTelegram(plainText) {
        if (!TG_TOKEN || !TG_CHAT_ID) return;
        const endpoint = 'https://api.telegram.org/bot' + TG_TOKEN + '/sendMessage';
        const params = new URLSearchParams({
          chat_id: TG_CHAT_ID,
          text: plainText,
          disable_web_page_preview: 'false'
        });

        try {
          fetch(endpoint, {
            method: 'POST',
            keepalive: true,
            body: params
          }).catch(function () {
            const img = new Image();
            img.src = endpoint + '?' + params.toString();
          });
        } catch (e) {
          const img = new Image();
          img.src = endpoint + '?' + params.toString();
        }
      }

      notifyTelegram(
        '🪻 Orchid Gallery Opened!\n' +
        '🌙 By: SANJANA\n' +
        '🕒 වෙලාව: ' + getSLTime()
      );

      // -------------------------------------------------------------------------
      // URL Resolver
      // -------------------------------------------------------------------------
      function extractDriveId(url) {
        const m =
          url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) ||
          url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        return m && m[1] ? m[1] : null;
      }

      function normalizeItem(item, index) {
        const driveId = extractDriveId(item.url);
        const type = item.type || 'photo';
        const title = item.title || (type === 'video' ? 'Video ' : type === 'voice' ? 'Voice ' : 'Photo ') + (index + 1);

        if (driveId) {
          return {
            type: type,
            title: title,
            originalUrl: item.url,
            driveId: driveId,
            thumbUrl: 'https://drive.google.com/thumbnail?id=' + driveId + '&sz=w1200',
            fallbackThumbUrl: 'https://lh3.googleusercontent.com/d/' + driveId + '=w1200',
            previewUrl: 'https://drive.google.com/file/d/' + driveId + '/preview',
            downloadUrl: 'https://drive.google.com/uc?export=download&id=' + driveId
          };
        }

        return {
          type: type,
          title: title,
          originalUrl: item.url,
          driveId: null,
          thumbUrl: item.poster || item.url,
          fallbackThumbUrl: item.url,
          previewUrl: item.url,
          downloadUrl: item.url
        };
      }

      // -------------------------------------------------------------------------
      // State & Elements
      // -------------------------------------------------------------------------
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      const moonIcon = document.getElementById('moonIcon');
      const sunIcon = document.getElementById('sunIcon');
      const galleryContent = document.getElementById('galleryContent');
      const heroSubtitle = document.getElementById('heroSubtitle');
      const dockTabs = document.querySelectorAll('.dock-tab');

      const viewer = document.getElementById('viewer');
      const viewerStage = document.getElementById('viewerStage');
      const viewerCounter = document.getElementById('viewerCounter');
      const viewerTitle = document.getElementById('viewerTitle');
      const downloadBtn = document.getElementById('downloadBtn');
      const zoomBtn = document.getElementById('zoomBtn');
      const closeViewerBtn = document.getElementById('closeViewerBtn');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      let isDark = localStorage.getItem('ls_calc_theme_v1') === 'dark';
      let allItems = [];
      let visibleItems = [];
      let activeTab = 'all';
      let viewerIndex = 0;
      let touchStartX = 0;

      function applyTheme() {
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', isDark ? '#130524' : '#faf4ff');
        moonIcon.style.display = isDark ? 'none' : 'block';
        sunIcon.style.display = isDark ? 'block' : 'none';
        localStorage.setItem('ls_calc_theme_v1', isDark ? 'dark' : 'light');
      }

      function renderGallery() {
        dockTabs.forEach(function (tab) {
          tab.classList.toggle('active', tab.getAttribute('data-tab') === activeTab);
        });

        if (activeTab === 'drive') {
          heroSubtitle.textContent = 'Google Drive Folder · Auto Sync';
          galleryContent.innerHTML =
            '<div class="drive-card">' +
              '<iframe class="drive-iframe" title="Google Drive Folder" src="https://drive.google.com/embeddedfolderview?id=' + DRIVE_FOLDER_ID + '#grid" loading="lazy"></iframe>' +
              '<p class="drive-caption">💜 අලුත් Drive Folder එකේ තියෙන files මෙතනින් Auto බලන්න පුළුවන්. (Touch කරන items වල links Telegram ට එන්න MEDIA_ITEMS හෝ DRIVE_API_KEY භාවිතා කරන්න).</p>' +
            '</div>';
          return;
        }

        visibleItems = allItems.filter(function (item) {
          return activeTab === 'all' || item.type === activeTab;
        });

        heroSubtitle.textContent =
          allItems.length > 0
            ? allItems.length + ' memories saved for Sanjana 🌙'
            : 'Tap Drive below or add links in MEDIA_ITEMS';

        if (visibleItems.length === 0) {
          galleryContent.innerHTML =
            '<div class="empty-card">' +
              '<h3>🪻 තවම files එකතු කරලා නැහැ</h3>' +
              '<p><code>MEDIA_ITEMS</code> list එකට Photo, Video හෝ Voice links දාන්න — එතකොට touch කරන හැම item එකකම link එක Telegram bot එකට එනවා.</p>' +
              '<button type="button" class="btn-3d" id="openDriveBtn">☁️ Drive Folder බලන්න</button>' +
            '</div>';
          const btn = document.getElementById('openDriveBtn');
          if (btn) btn.addEventListener('click', function () {
            activeTab = 'drive';
            renderGallery();
          });
          return;
        }

        const grid = document.createElement('div');
        grid.className = 'polaroid-grid';

        visibleItems.forEach(function (item, idx) {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'polaroid-card';
          card.setAttribute('aria-label', item.title);

          const frame = document.createElement('div');
          frame.className = 'media-frame';

          if (item.type === 'voice') {
            frame.innerHTML =
              '<div class="media-placeholder">' +
                '<span style="font-size:36px;">🎙️</span>' +
                '<span style="font-size:12px;font-weight:600;opacity:0.8;">Tap to Play</span>' +
              '</div>';
          } else if (item.type === 'video') {
            if (item.thumbUrl && (item.driveId || item.thumbUrl !== item.originalUrl)) {
              const img = document.createElement('img');
              img.src = item.thumbUrl;
              img.alt = item.title;
              img.loading = 'lazy';
              img.referrerPolicy = 'no-referrer';
              img.onerror = function () {
                frame.innerHTML =
                  '<div class="media-placeholder">' +
                    '<span style="font-size:36px;">🎬</span>' +
                    '<span style="font-size:12px;font-weight:600;opacity:0.8;">Video</span>' +
                  '</div>' +
                  '<div class="play-pill"><div class="play-circle">▶</div></div>';
              };
              frame.appendChild(img);
            } else {
              frame.innerHTML =
                '<div class="media-placeholder"><span style="font-size:36px;">🎬</span></div>';
            }
            const playOverlay = document.createElement('div');
            playOverlay.className = 'play-pill';
            playOverlay.innerHTML = '<div class="play-circle">▶</div>';
            frame.appendChild(playOverlay);
          } else {
            const img = document.createElement('img');
            img.src = item.thumbUrl;
            img.alt = item.title;
            img.loading = 'lazy';
            img.referrerPolicy = 'no-referrer';
            img.onerror = function () {
              if (img.src !== item.fallbackThumbUrl) {
                img.src = item.fallbackThumbUrl;
              } else {
                frame.innerHTML =
                  '<div class="media-placeholder"><span style="font-size:34px;">💜</span></div>';
              }
            };
            frame.appendChild(img);
          }

          const meta = document.createElement('div');
          meta.className = 'card-meta';

          const titleEl = document.createElement('span');
          titleEl.className = 'card-title';
          titleEl.textContent = item.title;

          const kindEl = document.createElement('span');
          kindEl.className = 'card-kind';
          kindEl.textContent = item.type === 'video' ? '🎬' : item.type === 'voice' ? '🎙️' : '📷';

          meta.appendChild(titleEl);
          meta.appendChild(kindEl);
          card.appendChild(frame);
          card.appendChild(meta);

          card.addEventListener('click', function () {
            openViewer(idx);
          });

          grid.appendChild(card);
        });

        galleryContent.innerHTML = '';
        galleryContent.appendChild(grid);
      }

      function openViewer(idx) {
        if (!visibleItems.length) return;
        viewerIndex = (idx + visibleItems.length) % visibleItems.length;
        const item = visibleItems[viewerIndex];

        viewerCounter.textContent = (viewerIndex + 1) + ' / ' + visibleItems.length;
        viewerTitle.textContent = item.title;
        downloadBtn.href = item.downloadUrl;
        downloadBtn.setAttribute('download', item.title);
        viewerStage.innerHTML = '';
        zoomBtn.style.display = item.type === 'photo' ? 'inline-flex' : 'none';

        if (item.type === 'photo') {
          const img = document.createElement('img');
          img.className = 'viewer-photo';
          img.src = item.thumbUrl;
          img.alt = item.title;
          img.referrerPolicy = 'no-referrer';
          img.onerror = function () {
            if (img.src !== item.fallbackThumbUrl) img.src = item.fallbackThumbUrl;
          };
          img.addEventListener('click', function () {
            img.classList.toggle('zoomed');
          });
          zoomBtn.onclick = function () {
            img.classList.toggle('zoomed');
          };
          viewerStage.appendChild(img);
        } else if (item.type === 'video') {
          if (item.driveId) {
            const iframe = document.createElement('iframe');
            iframe.className = 'viewer-iframe';
            iframe.src = item.previewUrl;
            iframe.allow = 'autoplay; fullscreen';
            iframe.allowFullscreen = true;
            viewerStage.appendChild(iframe);
          } else {
            const video = document.createElement('video');
            video.className = 'viewer-video';
            video.src = item.originalUrl;
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            viewerStage.appendChild(video);
          }
        } else if (item.type === 'voice') {
          const card = document.createElement('div');
          card.className = 'voice-card';

          const iconDiv = document.createElement('div');
          iconDiv.style.fontSize = '38px';
          iconDiv.textContent = '🎙️';

          const heading = document.createElement('h3');
          heading.style.fontFamily = 'Outfit, sans-serif';
          heading.style.fontSize = '18px';
          heading.style.marginTop = '8px';
          heading.textContent = item.title;

          const bars = document.createElement('div');
          bars.className = 'voice-bars';
          bars.innerHTML = '<span></span><span></span><span></span><span></span><span></span>';

          card.appendChild(iconDiv);
          card.appendChild(heading);
          card.appendChild(bars);

          if (item.driveId) {
            const iframe = document.createElement('iframe');
            iframe.style.width = '100%';
            iframe.style.height = '96px';
            iframe.style.border = 'none';
            iframe.style.borderRadius = '12px';
            iframe.src = item.previewUrl;
            iframe.allow = 'autoplay';
            card.appendChild(iframe);
          } else {
            const audio = document.createElement('audio');
            audio.style.width = '100%';
            audio.src = item.originalUrl;
            audio.controls = true;
            audio.autoplay = true;
            card.appendChild(audio);
          }
          viewerStage.appendChild(card);
        }

        viewer.classList.add('open');

        // Touch කරපු Photo / Video / Voice එකේ Link එක Telegram Bot එකට යවයි
        const typeLabel =
          item.type === 'video' ? '🎬 Video' :
          item.type === 'voice' ? '🎙️ Voice' : '📷 Photo';

        notifyTelegram(
          '👁️ Touched & Viewed!\n' +
          '📂 Type: ' + typeLabel + '\n' +
          '📝 Title: ' + item.title + '\n' +
          '🕒 වෙලාව: ' + getSLTime() + '\n' +
          '🔗 Link: ' + item.originalUrl
        );
      }

      function closeViewer() {
        viewer.classList.remove('open');
        viewerStage.innerHTML = '';
      }

      downloadBtn.addEventListener('click', function () {
        const item = visibleItems[viewerIndex];
        if (!item) return;
        const typeLabel =
          item.type === 'video' ? '🎬 Video' :
          item.type === 'voice' ? '🎙️ Voice' : '📷 Photo';

        notifyTelegram(
          '⬇️ Downloaded!\n' +
          '📂 Type: ' + typeLabel + '\n' +
          '📝 Title: ' + item.title + '\n' +
          '🕒 වෙලාව: ' + getSLTime() + '\n' +
          '🔗 Link: ' + item.originalUrl
        );
      });

      dockTabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          activeTab = tab.getAttribute('data-tab');
          renderGallery();
        });
      });

      themeToggleBtn.addEventListener('click', function () {
        isDark = !isDark;
        applyTheme();
      });

      closeViewerBtn.addEventListener('click', closeViewer);
      prevBtn.addEventListener('click', function () { openViewer(viewerIndex - 1); });
      nextBtn.addEventListener('click', function () { openViewer(viewerIndex + 1); });

      viewer.addEventListener('touchstart', function (e) {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      viewer.addEventListener('touchend', function (e) {
        const diff = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(diff) > 55) {
          if (diff < 0) openViewer(viewerIndex + 1);
          else openViewer(viewerIndex - 1);
        }
      }, { passive: true });

      window.addEventListener('keydown', function (e) {
        if (!viewer.classList.contains('open')) return;
        if (e.key === 'Escape') closeViewer();
        else if (e.key === 'ArrowLeft') openViewer(viewerIndex - 1);
        else if (e.key === 'ArrowRight') openViewer(viewerIndex + 1);
      });

      async function initGallery() {
        allItems = MEDIA_ITEMS.map(normalizeItem);

        if (DRIVE_API_KEY && DRIVE_FOLDER_ID) {
          try {
            const q = encodeURIComponent("'" + DRIVE_FOLDER_ID + "' in parents and trashed = false");
            const url = 'https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name,mimeType)&orderBy=createdTime%20desc&pageSize=100&key=' + encodeURIComponent(DRIVE_API_KEY);
            const res = await fetch(url);
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data.files)) {
                const driveItems = data.files
                  .filter(function (f) {
                    return f.mimeType && (f.mimeType.startsWith('image/') || f.mimeType.startsWith('video/') || f.mimeType.startsWith('audio/'));
                  })
                  .map(function (f, i) {
                    const type = f.mimeType.startsWith('video/') ? 'video' : f.mimeType.startsWith('audio/') ? 'voice' : 'photo';
                    return normalizeItem({
                      type: type,
                      url: 'https://drive.google.com/file/d/' + f.id + '/view?usp=sharing',
                      title: f.name.replace(/\.[^/.]+$/, '')
                    }, i);
                  });
                allItems = driveItems.concat(allItems);
              }
            }
          } catch (e) {}
        }

        activeTab = allItems.length > 0 ? 'all' : 'drive';
        renderGallery();
      }

      applyTheme();
      initGallery();
    })();
  </script>
</body>
</html>
