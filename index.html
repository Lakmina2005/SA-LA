<!doctype html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f0ff" />
  <title>L-S Calculator — Manuu 👑️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #f6f1ff;
      --bg-glow: rgba(168, 85, 247, 0.16);
      --text-main: #2e1065;
      --text-muted: rgba(107, 33, 168, 0.78);
      --card-bg: rgba(252, 250, 255, 0.95);
      --card-border: rgba(216, 180, 254, 0.9);
      --card-shadow: 0 20px 48px rgba(109, 40, 217, 0.14), 0 8px 0 #e2ccff;
      --screen-bg: rgba(244, 238, 255, 0.92);
      --screen-border: rgba(216, 180, 254, 0.9);
      --screen-shadow: inset 0 2px 8px rgba(109, 40, 217, 0.08);
      --divider: rgba(216, 180, 254, 0.7);
      --icon-hover: rgba(233, 213, 255, 0.65);

      --digit-bg: linear-gradient(180deg, #ffffff 0%, #f6f1ff 100%);
      --digit-bg-hover: linear-gradient(180deg, #ffffff 0%, #faf5ff 100%);
      --digit-color: #2e1065;
      --digit-border: rgba(216, 180, 254, 0.9);
      --digit-shadow: 0 4px 0 #d8b4fe, 0 6px 12px rgba(126, 34, 206, 0.08);
      --digit-shadow-active: 0 1px 0 #d8b4fe, 0 2px 4px rgba(126, 34, 206, 0.08);

      --op-bg: linear-gradient(180deg, #efe5ff 0%, #e3d0ff 100%);
      --op-bg-hover: linear-gradient(180deg, #f3ebff 0%, #e7d6ff 100%);
      --op-color: #6b21a8;
      --op-border: rgba(192, 132, 252, 0.8);
      --op-shadow: 0 4px 0 #c084fc, 0 6px 12px rgba(147, 51, 234, 0.12);
      --op-shadow-active: 0 1px 0 #c084fc;

      --ac-bg: linear-gradient(180deg, #ffeef6 0%, #fbd5e8 100%);
      --ac-bg-hover: linear-gradient(180deg, #fff2f8 0%, #fce0ee 100%);
      --ac-color: #be123c;
      --ac-border: #fecdd3;
      --ac-shadow: 0 4px 0 #f472b6, 0 6px 12px rgba(219, 39, 119, 0.1);
      --ac-shadow-active: 0 1px 0 #f472b6;

      --eq-bg: linear-gradient(180deg, #9333ea 0%, #7e22ce 100%);
      --eq-bg-hover: linear-gradient(180deg, #a855f7 0%, #9333ea 100%);
      --eq-color: #ffffff;
      --eq-border: rgba(147, 51, 234, 0.65);
      --eq-shadow: 0 4px 0 #581c87, 0 8px 18px rgba(126, 34, 206, 0.34);
      --eq-shadow-active: 0 1px 0 #581c87, 0 3px 8px rgba(126, 34, 206, 0.28);

      --sheet-bg: #faf7ff;
      --sheet-handle: #d8b4fe;
      --note-bg: linear-gradient(180deg, #fcfaff 0%, #f3e8ff 100%);
      --error-color: #e11d48;
      --redirect-color: #c026d3;
      --heart-color: #c026d3;
    }

    html[data-theme="dark"] {
      --bg-page: #10061f;
      --bg-glow: rgba(192, 38, 211, 0.18);
      --text-main: #faf5ff;
      --text-muted: rgba(216, 180, 254, 0.8);
      --card-bg: rgba(27, 13, 51, 0.95);
      --card-border: rgba(168, 85, 247, 0.3);
      --card-shadow: 0 24px 56px rgba(0, 0, 0, 0.65), 0 8px 0 #110622;
      --screen-bg: rgba(18, 8, 36, 0.95);
      --screen-border: rgba(168, 85, 247, 0.3);
      --screen-shadow: inset 0 2px 14px rgba(0, 0, 0, 0.65);
      --divider: rgba(107, 33, 168, 0.5);
      --icon-hover: rgba(107, 33, 168, 0.45);

      --digit-bg: linear-gradient(180deg, #2c194d 0%, #21123b 100%);
      --digit-bg-hover: linear-gradient(180deg, #36205d 0%, #281647 100%);
      --digit-color: #faf5ff;
      --digit-border: rgba(147, 51, 234, 0.4);
      --digit-shadow: 0 4px 0 #110722, 0 6px 14px rgba(0, 0, 0, 0.4);
      --digit-shadow-active: 0 1px 0 #110722;

      --op-bg: linear-gradient(180deg, #432375 0%, #32185c 100%);
      --op-bg-hover: linear-gradient(180deg, #4f2b88 0%, #3b1d6b 100%);
      --op-color: #f5d0fe;
      --op-border: rgba(192, 132, 252, 0.35);
      --op-shadow: 0 4px 0 #190933, 0 6px 14px rgba(0, 0, 0, 0.45);
      --op-shadow-active: 0 1px 0 #190933;

      --ac-bg: linear-gradient(180deg, #57193e 0%, #40102c 100%);
      --ac-bg-hover: linear-gradient(180deg, #66204a 0%, #4d1435 100%);
      --ac-color: #fecdd3;
      --ac-border: rgba(251, 113, 133, 0.35);
      --ac-shadow: 0 4px 0 #240618, 0 6px 14px rgba(0, 0, 0, 0.45);
      --ac-shadow-active: 0 1px 0 #240618;

      --eq-bg: linear-gradient(180deg, #c026d3 0%, #9333ea 100%);
      --eq-bg-hover: linear-gradient(180deg, #d946ef 0%, #a855f7 100%);
      --eq-color: #ffffff;
      --eq-border: rgba(232, 121, 249, 0.5);
      --eq-shadow: 0 4px 0 #4a044e, 0 8px 20px rgba(192, 38, 211, 0.35);
      --eq-shadow-active: 0 1px 0 #4a044e;

      --sheet-bg: #1a0d30;
      --sheet-handle: #6b21a8;
      --note-bg: linear-gradient(180deg, #241142 0%, #16092b 100%);
      --error-color: #fb7185;
      --redirect-color: #f0abfc;
      --heart-color: #f0abfc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100dvh;
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      overscroll-behavior-y: contain;
      transition: background-color 200ms ease, color 200ms ease;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      position: relative;
      overflow-x: hidden;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 0%, var(--bg-glow), transparent 58%);
      z-index: 0;
    }

    .layout {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
      align-items: center;
    }

    @media (min-width: 960px) {
      .layout {
        grid-template-columns: 7fr 5fr;
      }
    }

    .calc-wrap {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .calculator-card {
      width: 100%;
      max-width: 396px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 18px;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(12px);
      transition: background 200ms ease, border-color 200ms ease, box-shadow 200ms ease;
    }

    @media (min-width: 480px) {
      .calculator-card {
        padding: 24px;
      }
    }

    /* Header */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    .brand h1 {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .brand p {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .icon-btn {
      min-width: 44px;
      min-height: 44px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 150ms ease, transform 120ms ease, color 150ms ease;
    }

    .icon-btn:hover {
      background-color: var(--icon-hover);
      color: var(--text-main);
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .heart-btn {
      color: var(--heart-color);
    }

    @media (min-width: 960px) {
      .mobile-only {
        display: none;
      }
    }

    /* Display Screen */
    .display-box {
      background: var(--screen-bg);
      border: 1px solid var(--screen-border);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: var(--screen-shadow);
    }

    .display-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 36px;
      margin-bottom: 4px;
    }

    .prev-expr {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .display-tools {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .mini-btn {
      min-width: 36px;
      min-height: 36px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 150ms ease, transform 120ms ease, color 150ms ease;
    }

    .mini-btn:hover {
      background-color: var(--icon-hover);
      color: var(--text-main);
    }

    .mini-btn:active {
      transform: scale(0.93);
    }

    .display-main-wrap {
      min-height: 54px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      overflow: hidden;
    }

    .display-main {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 38px;
      line-height: 1.12;
      letter-spacing: -0.02em;
      text-align: right;
      word-break: break-all;
      color: var(--text-main);
      transition: font-size 120ms ease, color 150ms ease;
    }

    .display-main.md { font-size: 30px; }
    .display-main.sm { font-size: 24px; }
    .display-main.is-error { font-size: 24px; color: var(--error-color); }
    .display-main.is-redirect { font-size: 24px; color: var(--redirect-color); }

    /* Keypad */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .calc-btn {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 21px;
      font-weight: 600;
      min-height: 58px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition:
        transform 120ms cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 120ms cubic-bezier(0.16, 1, 0.3, 1),
        background 150ms ease;
    }

    @media (min-width: 480px) {
      .calc-btn {
        min-height: 62px;
        font-size: 22px;
      }
    }

    .btn-digit {
      background: var(--digit-bg);
      color: var(--digit-color);
      border: 1px solid var(--digit-border);
      box-shadow: var(--digit-shadow);
    }
    .btn-digit:hover { background: var(--digit-bg-hover); }
    .btn-digit:active {
      transform: translateY(3px);
      box-shadow: var(--digit-shadow-active);
    }

    .btn-op {
      background: var(--op-bg);
      color: var(--op-color);
      border: 1px solid var(--op-border);
      box-shadow: var(--op-shadow);
    }
    .btn-op:hover { background: var(--op-bg-hover); }
    .btn-op:active {
      transform: translateY(3px);
      box-shadow: var(--op-shadow-active);
    }

    .btn-ac {
      background: var(--ac-bg);
      color: var(--ac-color);
      border: 1px solid var(--ac-border);
      box-shadow: var(--ac-shadow);
    }
    .btn-ac:hover { background: var(--ac-bg-hover); }
    .btn-ac:active {
      transform: translateY(3px);
      box-shadow: var(--ac-shadow-active);
    }

    .btn-eq {
      background: var(--eq-bg);
      color: var(--eq-color);
      border: 1px solid var(--eq-border);
      box-shadow: var(--eq-shadow);
    }
    .btn-eq:hover { background: var(--eq-bg-hover); }
    .btn-eq:active {
      transform: translateY(3px);
      box-shadow: var(--eq-shadow-active);
    }

    .span-2 {
      grid-column: span 2;
    }

    /* Footer */
    .card-footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-footer .signature {
      font-family: 'Outfit', system-ui, sans-serif;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    /* Desktop History Panel */
    .desktop-history {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 14px 34px rgba(109, 40, 217, 0.08);
    }

    @media (min-width: 960px) {
      .desktop-history {
        display: block;
      }
    }

    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--divider);
    }

    .history-head h2 {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 18px;
      font-weight: 600;
    }

    .history-count {
      font-size: 12px;
      color: var(--text-muted);
    }

    .history-actions-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .clear-hist-btn {
      border: none;
      background: transparent;
      color: var(--ac-color);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    .clear-hist-btn:hover {
      background: var(--icon-hover);
    }

    .history-list {
      list-style: none;
      max-height: 330px;
      overflow-y: auto;
    }

    .history-item + .history-item {
      border-top: 1px solid var(--divider);
    }

    .history-item button {
      width: 100%;
      min-height: 56px;
      border: none;
      background: transparent;
      text-align: right;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      color: var(--text-main);
    }

    .history-item button:hover {
      background: var(--icon-hover);
    }

    .history-expr {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
    }

    .history-res {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 600;
    }

    .history-empty {
      text-align: center;
      padding: 36px 12px;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Mobile Bottom Sheet & Love Note Modal */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      flex-direction: column;
      justify-content: flex-end;
      background: rgba(46, 16, 101, 0.48);
      backdrop-filter: blur(5px);
    }

    .sheet-backdrop.open {
      display: flex;
    }

    .sheet-panel {
      background: var(--sheet-bg);
      border-top: 1px solid var(--card-border);
      border-radius: 26px 26px 0 0;
      padding: 12px 20px calc(24px + env(safe-area-inset-bottom));
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.25);
    }

    .sheet-handle {
      width: 40px;
      height: 5px;
      border-radius: 999px;
      background: var(--sheet-handle);
      margin: 0 auto 12px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(46, 16, 101, 0.5);
      backdrop-filter: blur(5px);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .note-card {
      position: relative;
      width: 100%;
      max-width: 360px;
      background: var(--note-bg);
      border: 1px solid var(--card-border);
      border-radius: 26px;
      padding: 26px 22px 20px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(109, 40, 217, 0.32);
    }

    .note-close {
      position: absolute;
      top: 10px;
      right: 10px;
    }

    .note-badge {
      width: 50px;
      height: 50px;
      border-radius: 18px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--op-bg);
      color: var(--heart-color);
      font-size: 24px;
    }

    .note-title {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .note-body {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .note-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--divider);
    }

    .note-from {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .note-next-btn {
      border: none;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 12px;
      background: var(--eq-bg);
      color: #ffffff;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 3px 0 #581c87;
      cursor: pointer;
      transition: transform 120ms ease;
    }

    .note-next-btn:active {
      transform: translateY(2px);
    }

    /* Floating Lavender Hearts */
    .hearts-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 70;
    }

    .floating-heart {
      position: absolute;
      bottom: 15%;
      font-size: 20px;
      opacity: 0;
      animation: floatUpHeart 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatUpHeart {
      0% {
        transform: translateY(0) scale(0.7);
        opacity: 0;
      }
      20% {
        opacity: 0.95;
      }
      100% {
        transform: translateY(-220px) scale(1.25);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .calc-btn, .icon-btn, .mini-btn { transition: none; }
      .floating-heart { animation: none; display: none; }
    }
  </style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>

  <main class="layout">
    <section class="calc-wrap" aria-label="3D Lavender Calculator">
      <div class="calculator-card">
        <header class="card-header">
          <div class="brand">
            <h1>L-S Calculator 🧮</h1>
            <p>Manuu 👑️</p>
          </div>
          <div class="header-actions">
            <button type="button" class="icon-btn heart-btn" id="loveNoteBtn" aria-label="Sweet Note" title="Sweet Note 💜">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>
            <button type="button" class="icon-btn mobile-only" id="openHistoryBtn" aria-label="History" title="History">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
            </button>
            <button type="button" class="icon-btn" id="soundToggleBtn" aria-label="Toggle sound" title="Sound">
              <svg id="soundOnIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
              <svg id="soundOffIcon" style="display:none" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>

      function safeEvaluate(raw) {
        const norm = raw.replace(/×/g, '*').replace(/÷/g, '/').replace(/\s+/g, '');
        if (!norm || !/^[0-9+\-*/().]+$/.test(norm)) throw new Error('Invalid');
        let pos = 0;
        function peek() { return norm[pos] || ''; }
        function consume() { return norm[pos++]; }
        function parseExpr() {
          let v = parseTerm();
          while (peek() === '+' || peek() === '-') {
            const op = consume();
            const r = parseTerm();
            v = op === '+' ? v + r : v - r;
          }
          return v;
        }
        function parseTerm() {
          let v = parseFactor();
          while (peek() === '*' || peek() === '/') {
            const op = consume();
            const r = parseFactor();
            if (op === '/') {
              if (r === 0) throw new Error('Div0');
              v /= r;
            } else {
              v *= r;
            }
          }
          return v;
        }
        function parseFactor() {
          const ch = peek();
          if (ch === '+') { consume(); return parseFactor(); }
          if (ch === '-') { consume(); return -parseFactor(); }
          if (ch === '(') {
            consume();
            const v = parseExpr();
            if (consume() !== ')') throw new Error('Paren');
            return v;
          }
          return parseNumber();
        }
        function parseNumber() {
          const start = pos;
          let digits = false;
          let dot = false;
          while (pos < norm.length) {
            const c = norm[pos];
            if (c >= '0' && c <= '9') { digits = true; pos++; }
            else if (c === '.' && !dot) { dot = true; pos++; }
            else break;
          }
          if (!digits) throw new Error('Num');
          const n = Number(norm.slice(start, pos));
          if (!Number.isFinite(n)) throw new Error('Inf');
          return n;
        }
        const res = parseExpr();
        if (pos !== norm.length || !Number.isFinite(res)) throw new Error('Trail');
        return Number(res.toPrecision(12));
      }

      });

      function handleHistoryClick(e) {
        const clearBtn = e.target.closest('[data-clear-history]');
        if (clearBtn) {
          history = [];
          localStorage.setItem('ls_calc_history_v1', '[]');
          renderHistory();
          return;
        }
        const itemBtn = e.target.closest('[data-reuse]');
        if (itemBtn) {
          playFeedback('digit');
          expression = itemBtn.getAttribute('data-reuse');
          previousExpression = '';
          justEvaluated = true;
          isError = false;
          renderDisplay();
          historySheet.classList.remove('open');
        }
      }

      desktopHistoryContainer.addEventListener('click', handleHistoryClick);
      mobileHistoryContainer.addEventListener('click', handleHistoryClick);

      window.addEventListener('keydown', function (e) {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const k = e.key;
        if (/^[0-9]$/.test(k) || k === '.' || k === '(' || k === ')' || OPERATORS.has(k)) {
          e.preventDefault();
          appendValue(k);
        } else if (k === 'Enter' || k === '=') {
          e.preventDefault();
          calculateResult();
        } else if (k === 'Backspace') {
          e.preventDefault();
          backspace();
        } else if (k === 'Escape' || k === 'Delete') {
          e.preventDefault();
          clearDisplay();
        }
      });

      applyTheme();
      applySoundIcon();
      renderDisplay();
      renderHistory();
      renderNote();
    })();
  </script>
</body>
</html>
